name: Alerta Discord

on:
  push:
    branches:
      - main

jobs:
  discord:
    runs-on: ubuntu-latest

    steps:
      - name: Enviar alerta para o Discord
        run: |
          curl -H "Content-Type: application/json" \
          -d "{\"content\":\"🚀 Novo commit realizado na branch main do projeto DevOps PUCPR!\"}" \
          "${{ secrets.DISCORD_WEBHOOK_URL }}"
