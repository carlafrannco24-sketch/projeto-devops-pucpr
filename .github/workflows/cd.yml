name: CD - GitHub Pages

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  preparar-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verificar arquivos do site
        run: |
          test -f index.html
          test -f styles.css
          test -f script.js

      - name: Upload do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

  deploy:
    if: github.event_name == 'push'
    needs: preparar-deploy

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
